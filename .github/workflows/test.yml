name: tests

# The suite claims to run offline with no credentials. Nothing enforced that,
# and on a machine with a configured `.env` ten tests failed while the rest
# passed for the wrong reason - reaching live Supabase and live Groq. This
# workflow is the enforcement: no secrets are configured for this job, so a
# test that needs a credential fails here rather than in six months.
#
# `-m "not network"` deselects the one test that genuinely needs a live
# Postgres. That test is the Phase 6 exit criterion and is run by hand against
# a real project; a skip is not a pass, and neither is a deselect.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the offline suite
        # No `env:` block, deliberately. The absence of credentials is the
        # assertion.
        run: pytest -q -m "not network"

      - name: Prove the retrieval measurements still reproduce
        # Free, deterministic, no key. These are the numbers committed in
        # retrieval_comparison.json and eval_sweep.json, so a change that moves
        # them should have to say so in a diff.
        run: |
          python -m eval.harness --retrieval-only --compare lexical,hybrid --profile local --store files
          python -m eval.harness --sweep --profile local

  e2e:
    # The browser half of the same bargain. `npm run test:e2e` stubs `POST /ask`
    # with `page.route`, so it needs no backend, no database and no API key -
    # which is what makes it safe to run on every push. The `@live` tests, which
    # drive the real pipeline, are excluded by the script itself and are run by
    # hand.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the hermetic end-to-end suite
        # No `env:` block here either, for the same reason as the pytest job.
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
