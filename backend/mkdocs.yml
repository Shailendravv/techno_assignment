site_name: Runbook Agent
site_description: A grounded question-answering agent over 12 operational runbooks — retrieval, gating, and evaluation.
repo_name: cloud_techno_assignment
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture:
      - Overview: architecture/overview.md
      - Pipeline Components: architecture/components.md
      - Data Contracts: architecture/data-contracts.md
  - Evaluation:
      - The Scoring Model: evaluation/scoring.md
      - Gate Calibration: evaluation/gate-calibration.md
      - Hybrid Retrieval: evaluation/hybrid-retrieval.md
  - Deployment: deployment.md
  - Development History: development-history.md
  - Known Limitations: limitations.md
  - Reference:
      - Configuration: reference/configuration.md
      - Corpus: reference/corpus.md

extra:
  social: []

copyright: Built for the CloudTechner Agent Setup Exercise.
